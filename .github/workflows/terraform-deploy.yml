name: Deploy Terraform and Secrets

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Create Secrets & Deploy Terraform
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      OPENROUTER_SECRET_NAME: "/ai-doctor-assistant/openrouter_api_key"
      OPENAI_SECRET_NAME: "/ai-doctor-assistant/openai_api_key"
      ANTHROPIC_SECRET_NAME: "/ai-doctor-assistant/anthropic_api_key"
      EMAIL_APP_PASSWORD_SECRET_NAME: "/ai-doctor-assistant/email_app_password"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create or update Secrets Manager entries
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating/updating Secrets Manager secrets (only if corresponding GitHub Secrets set)"

          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            aws secretsmanager create-secret --name "$OPENROUTER_SECRET_NAME" --secret-string "${{ secrets.OPENROUTER_API_KEY }}" || \
              aws secretsmanager put-secret-value --secret-id "$OPENROUTER_SECRET_NAME" --secret-string "${{ secrets.OPENROUTER_API_KEY }}"
            echo "OpenRouter secret stored at $OPENROUTER_SECRET_NAME"
          else
            echo "OPENROUTER_API_KEY GitHub secret not set — skipping"
          fi

          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            aws secretsmanager create-secret --name "$OPENAI_SECRET_NAME" --secret-string "${{ secrets.OPENAI_API_KEY }}" || \
              aws secretsmanager put-secret-value --secret-id "$OPENAI_SECRET_NAME" --secret-string "${{ secrets.OPENAI_API_KEY }}"
            echo "OpenAI secret stored at $OPENAI_SECRET_NAME"
          else
            echo "OPENAI_API_KEY GitHub secret not set — skipping"
          fi

          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            aws secretsmanager create-secret --name "$ANTHROPIC_SECRET_NAME" --secret-string "${{ secrets.ANTHROPIC_API_KEY }}" || \
              aws secretsmanager put-secret-value --secret-id "$ANTHROPIC_SECRET_NAME" --secret-string "${{ secrets.ANTHROPIC_API_KEY }}"
            echo "Anthropic secret stored at $ANTHROPIC_SECRET_NAME"
          else
            echo "ANTHROPIC_API_KEY GitHub secret not set — skipping"
          fi

          if [ -n "${{ secrets.EMAIL_APP_PASSWORD }}" ]; then
            aws secretsmanager create-secret --name "$EMAIL_APP_PASSWORD_SECRET_NAME" --secret-string "${{ secrets.EMAIL_APP_PASSWORD }}" || \
              aws secretsmanager put-secret-value --secret-id "$EMAIL_APP_PASSWORD_SECRET_NAME" --secret-string "${{ secrets.EMAIL_APP_PASSWORD }}"
            echo "Email app password stored at $EMAIL_APP_PASSWORD_SECRET_NAME"
          else
            echo "EMAIL_APP_PASSWORD GitHub secret not set — skipping"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false -var-file=terraform.tfvars
